<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Environment -->
  <rect width="800" height="550" fill="url(#bgGrad)" rx="24" />
  
  <!-- Architectural Classroom Elements -->
  <rect x="40" y="40" width="720" height="470" rx="16" fill="#ffffff" filter="url(#cardShadow)" />
  
  <!-- Interactive Whiteboard / Seminar Display -->
  <rect x="80" y="70" width="640" height="180" rx="12" fill="url(#boardGrad)" />
  
  <!-- Header on Board -->
  <rect x="110" y="95" width="160" height="8" rx="4" fill="#fbbf24" />
  <rect x="110" y="115" width="280" height="6" rx="3" fill="#94a3b8" />
  
  <!-- CEFR Benchmark Grid on Board -->
  <g transform="translate(110, 140)">
    <rect x="0" y="0" width="70" height="35" rx="6" fill="#334155" />
    <text x="35" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">A1 - A2</text>
    <rect x="85" y="0" width="70" height="35" rx="6" fill="#334155" />
    <text x="120" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">B1 - B2</text>
    <rect x="170" y="0" width="70" height="35" rx="6" fill="#f59e0b" />
    <text x="205" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">C1 Master</text>
    <rect x="255" y="0" width="120" height="35" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="315" y="22" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">IELTS Band 7.5+</text>
  </g>

  <!-- Interactive Dialogue Waves (Communicative Teaching Visual) -->
  <path d="M 520 150 Q 560 120 600 150 T 680 150" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6" />
  <circle cx="530" cy="115" r="16" fill="#0284c7" />
  <text x="530" y="120" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">CLT</text>
  <text x="610" y="120" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Fluency &amp; Discourse</text>

  <!-- Seminar Desks & Participants (Structured Classroom Group) -->
  <!-- Center Desk -->
  <rect x="180" y="320" width="440" height="120" rx="16" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Student 1 (Left Learner) -->
  <g transform="translate(220, 260)">
    <circle cx="40" cy="30" r="28" fill="#cbd5e1" />
    <circle cx="40" cy="24" r="20" fill="#0369a1" />
    <path d="M 0 100 C 0 65, 80 65, 80 100 Z" fill="#0f172a" />
    <rect x="20" y="85" width="40" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  </g>

  <!-- Student 2 (Center Learner with Notebook) -->
  <g transform="translate(360, 255)">
    <circle cx="40" cy="30" r="28" fill="#e2e8f0" />
    <circle cx="40" cy="24" r="20" fill="#d97706" />
    <path d="M 0 105 C 0 70, 80 70, 80 105 Z" fill="#1e293b" />
    <rect x="15" y="88" width="50" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" />
    <line x1="25" y1="96" x2="55" y2="96" stroke="#94a3b8" stroke-width="2" />
    <line x1="25" y1="104" x2="45" y2="104" stroke="#94a3b8" stroke-width="2" />
  </g>

  <!-- Student 3 (Right Learner with Laptop) -->
  <g transform="translate(500, 260)">
    <circle cx="40" cy="30" r="28" fill="#cbd5e1" />
    <circle cx="40" cy="24" r="20" fill="#047857" />
    <path d="M 0 100 C 0 65, 80 65, 80 100 Z" fill="#0f172a" />
    <polygon points="15,110 65,110 55,90 25,90" fill="#38bdf8" />
  </g>

  <!-- Instructor / Language Facilitator (Front-Left) -->
  <g transform="translate(85, 230)">
    <circle cx="40" cy="35" r="30" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
    <circle cx="40" cy="28" r="22" fill="#1e293b" />
    <path d="M 5 110 C 5 70, 75 70, 75 110 Z" fill="#0369a1" />
    <!-- Facilitator gestures toward board -->
    <path d="M 65 75 Q 95 60 120 45" fill="none" stroke="#0369a1" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Floating Academic Badge: Session Schedule & Timezone -->
  <g transform="translate(510, 410)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="220" height="65" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <circle cx="32" cy="32" r="16" fill="#ecfdf5" />
    <path d="M 26 32 L 30 36 L 39 27" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="58" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Asia/Dhaka GMT+6</text>
    <text x="58" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Verified Session Rosters</text>
  </g>

  <!-- Floating Academic Badge: Small Cohort Guarantee -->
  <g transform="translate(70, 420)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="200" height="58" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <circle cx="30" cy="29" r="14" fill="#fef3c7" />
    <text x="30" y="34" font-family="system-ui, sans-serif" font-size="12" font-weight="black" fill="#b45309" text-anchor="middle">★</text>
    <text x="54" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">15–20 Students</text>
    <text x="54" y="43" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Active Speaking Time</text>
  </g>
</svg>

